# Prometheus + NGINX (mTLS) para exposição federada de métricas, conforme
# rbb-monitoracao e roteiro_prometheus_nginx.md. Executado a partir de /srv/rbb/prometheus.
services:
  prometheus:
    image: prom/prometheus:v3.5.0
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=30d
      - --web.enable-lifecycle
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./rules.yml:/etc/prometheus/rules.yml:ro
      - ./targets:/etc/prometheus/targets:ro
      - ./certs:/etc/prometheus/certs:ro
      - prometheus-data:/prometheus
    # 9090 no host: consultas locais (rbb-node prometheus reload/status) e acesso interno pela VPC
    # (o security group libera 9090 só para a VPC). Externamente, apenas via NGINX (443/8443).
    ports:
      - "9090:9090"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    depends_on:
      - prometheus
    ports:
      - "443:443"
      - "8443:8443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./certs:/etc/nginx/certs:ro
      - ./.htpasswd:/etc/nginx/.htpasswd:ro
      - ./logs:/var/log/nginx
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

  # Sondas de firewall/certificado dos Prometheus parceiros (só acessível pelo Prometheus, sem porta no host)
  blackbox:
    image: prom/blackbox-exporter:v0.27.0
    restart: unless-stopped
    command:
      - --config.file=/etc/blackbox/blackbox.yml
    volumes:
      - ./blackbox.yml:/etc/blackbox/blackbox.yml:ro
      - ./certs:/etc/blackbox/certs:ro
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

  # Grafana: painéis sobre o Prometheus local, em https://<ip>/grafana/ (login próprio; senha inicial em
  # .grafana-admin-initial). Fonte de dados e painéis provisionados a partir de ./grafana/provisioning.
  grafana:
    image: grafana/grafana-oss:11.4.0
    restart: unless-stopped
    depends_on:
      - prometheus
    env_file:
      - ./grafana/grafana.env
    environment:
      GF_SERVER_SERVE_FROM_SUB_PATH: "true"
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_SECURITY_COOKIE_SECURE: "true"
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana-data:/var/lib/grafana
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

volumes:
  prometheus-data:
  grafana-data:
